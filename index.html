
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101629">
<title>MULTO AI 2.0</title>
<style>
:root {
  --bg:#101629;
  --panel:#1b2742;
  --cyan:#54d6e8;
  --yellow:#ffd34e;
  --muted:#b8c5dd;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:white;
  font:16px system-ui,sans-serif;
}
main {max-width:650px;margin:auto;padding:20px 16px 45px}
header {display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo {background:var(--cyan);color:#101629;border-radius:14px;padding:12px;font-size:25px}
h1 {font-size:25px;margin:0;font-weight:900}
header small {color:var(--cyan);font-weight:800}
.tag {margin-left:auto;color:var(--yellow);font-size:12px}
.hero,.card {
  background:var(--panel);
  border-radius:22px;
  padding:19px;
  margin:14px 0;
}
.eyebrow {color:var(--yellow);font-size:11px;font-weight:900}
h2 {font-size:25px;margin:8px 0}
.muted {color:var(--muted);font-size:14px;line-height:1.5}
.stage {
  height:165px;
  border-radius:18px;
  background:radial-gradient(circle at 70% 20%,#263e6a,#111c35 65%);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:15px;
  position:relative;
}
.person {text-align:center}
.head {
  width:72px;height:72px;border-radius:50%;
  background:#080b14;margin:auto;
  display:flex;align-items:center;justify-content:center;gap:15px;
}
.eye {width:9px;height:9px;border-radius:50%;background:white}
.body {
  width:105px;height:62px;background:#2869d8;
  border-radius:25px 25px 8px 8px;
  display:grid;place-items:center;font-weight:900;
}
.star {position:absolute;right:22px;top:16px;color:var(--yellow);font-size:28px}
label {
  display:block;color:var(--cyan);
  font-size:12px;font-weight:900;
  margin:18px 0 8px;
}
input,textarea,select {
  width:100%;border:1px solid #53617a;
  border-radius:13px;background:#111c35;
  color:white;padding:13px;font:inherit;
}
textarea {min-height:110px;resize:vertical}
button {
  border:0;border-radius:14px;padding:13px 15px;
  font-weight:900;font-size:14px;cursor:pointer;
}
.primary {
  width:100%;background:var(--cyan);
  color:#101629;margin-top:20px;
}
.secondary {background:#293a5c;color:white}
.chips {display:flex;gap:8px;flex-wrap:wrap}
.chip {background:#293a5c;color:white;border-radius:30px}
.chip[aria-pressed=true] {background:var(--cyan);color:#101629}
#result {margin-top:22px}
.scene {
  background:#111c35;
  border:1px solid #344562;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}
.scene h3 {color:var(--cyan);margin:0 0 10px}
.scene p {font-size:14px;line-height:1.6;margin:7px 0}
.scene strong {color:var(--yellow)}
.character {
  background:#293a5c;
  padding:14px;border-radius:14px;
  line-height:1.6;font-size:14px;
}
.hidden {display:none}
footer {text-align:center;color:#8794ae;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">🎬</div>
  <div>
    <h1>MULTO AI</h1>
    <small>СТУДИЯ МУЛЬТФИЛЬМОВ</small>
  </div>
  <div class="tag">2.0 BETA</div>
</header>

<section class="hero">
  <div class="eyebrow">ТВОЯ ИДЕЯ → ТВОЙ МУЛЬТФИЛЬМ</div>
  <h2>Расскажи свою историю</h2>
  <div class="muted">
    Создавай сценарии и раскадровки для коротких 2D-мультфильмов.
  </div>
  <div class="stage">
    <div class="person">
      <div class="head">
        <i class="eye"></i><i class="eye"></i>
      </div>
      <div class="body">MULTO</div>
    </div>
    <div class="star">★</div>
  </div>
</section>

<section class="card">
  <label for="title">НАЗВАНИЕ РОЛИКА</label>
  <input id="title" placeholder="Название мультфильма"
    value="Что будет, если исчезнет Луна?">

  <label for="idea">ОПИШИ СЮЖЕТ ИЛИ ТЕМУ</label>
  <textarea id="idea">Объясни простыми словами, что произойдёт с Землёй, океанами и ночным небом, если Луна внезапно исчезнет.</textarea>

  <label>ДЛИТЕЛЬНОСТЬ</label>
  <div class="chips" id="durations">
    <button class="chip" aria-pressed="false">30 секунд</button>
    <button class="chip" aria-pressed="true">60 секунд</button>
    <button class="chip" aria-pressed="false">3 минуты</button>
    <button class="chip" aria-pressed="false">5 минут</button>
  </div>

  <label for="voice">ОЗВУЧКА</label>
  <select id="voice">
    <option>Энергичный рассказчик</option>
    <option selected>Спокойный рассказчик</option>
    <option>Несколько персонажей</option>
  </select>

  <button class="primary" id="make">
    ✨ СОЗДАТЬ ПЛАН МУЛЬТФИЛЬМА
  </button>

  <div id="result" aria-live="polite"></div>
  <button class="secondary hidden" id="download">
    📥 СКАЧАТЬ СЦЕНАРИЙ
  </button>
</section>

<footer>
  MULTO AI 2.0 · Бесплатный генератор сценариев
  <br>Для настоящей генерации видео потребуются дополнительные ИИ-сервисы.
</footer>
</main>

<script>
let duration = "60 секунд";
let savedPlan = "";

const durations = document.querySelectorAll(".chip");

durations.forEach(button => {
  button.addEventListener("click", () => {
    duration = button.textContent;
    durations.forEach(item => {
      item.setAttribute("aria-pressed",
        String(item === button));
    });
  });
});

function makeScenes(title, idea, voice, count) {
  const templates = [
    {
      name:"Знакомство с историей",
      visual:"Показать красивый общий план мира и главного персонажа.",
      action:"Персонаж появляется в кадре и замечает необычное событие.",
      speech:"Представьте себе такую ситуацию: " + idea
    },
    {
      name:"Неожиданное событие",
      visual:"Крупный план персонажа, который замечает перемены.",
      action:"Камера приближается, персонаж удивляется.",
      speech:"Но однажды всё меняется. Наш герой понимает, что произошло нечто необычное."
    },
    {
      name:"Первые последствия",
      visual:"Показать окружающий мир и происходящие в нём изменения.",
      action:"Персонаж внимательно наблюдает за происходящим.",
      speech:"Сначала изменения кажутся небольшими. Но постепенно становится понятно, насколько они важны."
    },
    {
      name:"Исследование",
      visual:"Персонаж рассматривает происходящее и пытается найти объяснение.",
      action:"Появляются простые наглядные иллюстрации.",
      speech:"Давай разберёмся, почему это происходит и что стоит за этим событием."
    },
    {
      name:"Главное открытие",
      visual:"Показать самое важное открытие истории крупным планом.",
      action:"Герой понимает основную мысль истории.",
      speech:"Теперь мы можем увидеть всю картину и понять главное последствие этой ситуации."
    },
    {
      name:"Финал",
      visual:"Красивый финальный кадр с персонажем и окружающим миром.",
      action:"Персонаж обращается к зрителю.",
      speech:"Вот такая удивительная история! А теперь подумайте: что бы вы сделали на месте нашего героя?"
    },
    {
      name:"Дополнительное объяснение",
      visual:"Показать наглядную схему или интересную деталь.",
      action:"Герой объясняет ещё одну важную подробность.",
      speech:"Есть ещё одна интересная деталь, которая помогает лучше понять эту историю."
    },
    {
      name:"Новый взгляд",
      visual:"Показать мир с другой точки зрения.",
      action:"Камера плавно меняет ракурс.",
      speech:"Если посмотреть на ситуацию с другой стороны, можно заметить ещё больше интересного."
    },
    {
      name:"Подведение итогов",
      visual:"Собрать основные образы истории в одном кадре.",
      action:"Герой подводит итог путешествия.",
      speech:"Теперь мы знаем намного больше. Даже самый необычный вопрос может привести к интересному открытию."
    },
    {
      name:"Последняя сцена",
      visual:"Показать яркий заключительный кадр.",
      action:"Герой машет зрителям.",
      speech:"Спасибо за просмотр! До встречи в следующем приключении MULTO!"
    },
    {
      name:"Интересный факт",
      visual:"Показать дополнительную иллюстрацию по теме.",
      action:"На экране появляется интересная деталь.",
      speech:"И напоследок запомните: у каждой истории есть детали, которые делают её ещё интереснее."
    },
    {
      name:"Завершение",
      visual:"Логотип MULTO AI на красивом фоне.",
      action:"Плавное затемнение и появление логотипа.",
      speech:"Это было наше новое приключение. Увидимся совсем скоро!"
    }
  ];

  let scenes = templates.slice(0, count);
  return scenes.map((scene, index) => ({
    ...scene,
    number:index + 1
  }));
}

function generate() {
  const title = document.getElementById("title").value.trim();
  const idea = document.getElementById("idea").value.trim();
  const voice = document.getElementById("voice").value;
  const result = document.getElementById("result");
  const download = document.getElementById("download");

  if (!title || !idea) {
    result.textContent = "Добавь название и описание сюжета.";
    download.classList.add("hidden");
    return;
  }

  const counts = {
    "30 секунд":3,
    "60 секунд":6,
    "3 минуты":9,
    "5 минут":12
  };

  const count = counts[duration];
  const scenes = makeScenes(title, idea, voice, count);

  let output =
`🎬 MULTO AI — ПЛАН МУЛЬТФИЛЬМА

Название: ${title}

Тема: ${idea}

Длительность: ${duration}
Озвучка: ${voice}
Формат: вертикальный 9:16
Стиль: 2D, тёмный фон, персонаж в синей толстовке.

👦 ПЕРСОНАЖ

Главный герой: дружелюбный человечек в синей толстовке.
Характер: любознательный, добрый, любит задавать вопросы.

🎞️ РАСКАДРОВКА

`;

  scenes.forEach(scene => {
    output += `
СЦЕНА ${scene.number}. ${scene.name}

🖼️ КАРТИНКА:
${scene.visual}

🎭 ДЕЙСТВИЕ:
${scene.action}

🎙️ ОЗВУЧКА:
${scene.speech}

`;
  });

  output += `
🎧 РЕКОМЕНДАЦИИ ПО ЗВУКУ

Стиль голоса: ${voice}.
Музыка: лёгкая фоновая инструментальная музыка.
Субтитры: крупные, хорошо читаемые.

🎬 КОНЕЦ ПЛАНА

Примечание: это сценарный план, созданный по шаблонам. 
Он не является готовым видео и не использует подключённую нейросеть.
`;

  savedPlan = output;

  result.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = "🎉 ТВОЙ ПЛАН ГОТОВ!";
  result.appendChild(heading);

  const intro = document.createElement("p");
  intro.className = "muted";
  intro.textContent = "Мы подготовили " + count +
    " сцен для твоего мультфильма.";
  result.appendChild(intro);

  const character = document.createElement("div");
  character.className = "character";
  character.textContent =
    "👦 Главный герой: человечек в синей толстовке. " +
    "Голос: " + voice + ".";
  result.appendChild(character);

  scenes.forEach(scene => {
    const card = document.createElement("div");
    card.className = "scene";

    const h = document.createElement("h3");
    h.textContent = "🎬 Сцена " + scene.number +
      ": " + scene.name;

    const visual = document.createElement("p");
    visual.innerHTML = "<strong>🖼️ Картинка:</strong>";
    visual.appendChild(document.createTextNode(" " + scene.visual));

    const action = document.createElement("p");
    action.innerHTML = "<strong>🎭 Действие:</strong>";
    action.appendChild(document.createTextNode(" " + scene.action));

    const speech = document.createElement("p");
    speech.innerHTML = "<strong>🎙️ Озвучка:</strong>";
    speech.appendChild(document.createTextNode(" " + scene.speech));

    card.append(h, visual, action, speech);
    result.appendChild(card);
  });

  download.classList.remove("hidden");
  download.scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("make").addEventListener("click", generate);

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([savedPlan], {
    type:"text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "multо-ai-scenario.txt";
  link.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
